[workspace]
resolver = "2"
members = ["proto", "crypto", "attest", "server", "core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["cherm.chat"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "sync",
    "time",
    "io-std",
    "process",
    "fs",
    "signal",
] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
dirs = "5"

# Privacy / message layer (Matrix's audited Olm+Megolm)
vodozemac = "0.10"
# Attestation: AWS Nitro TEE quote verification (pure-Rust) + software signatures
coset = "0.4"
ciborium = "0.2"
serde_bytes = "0.11"
p384 = "0.13"
x509-cert = { version = "0.2", features = ["pem"] }
minisign-verify = "0.2"
blake3 = "1"
hex = "0.4"

# Local crates
cherm-proto = { path = "proto" }
cherm-crypto = { path = "crypto" }
cherm-attest = { path = "attest" }

[profile.release]
lto = true
opt-level = 3
